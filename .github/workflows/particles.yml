name: particles
# GitHub-hosted runners (free for a public repository). No self-hosted runner and no model is involved.
on:
  push:
    paths: ["tools/**", ".github/workflows/particles.yml"]
  workflow_dispatch:
    inputs:
      msi:
        description: "also run on the MSI self-hosted runner (register one for this repo first)"
        type: boolean
        default: false

jobs:
  # The workstation's own compute, used when credits are scarce. Its manifest is reconciled
  # against the two GitHub-hosted machines below: three ledgers, one hash, or the run fails.
  msi:
    if: ${{ inputs.msi }}
    runs-on: [self-hosted, msi, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python tools/particles.py exactness
      - run: python tools/particles.py layer --layer 1 --recipe grid-feeder --seed 2026-09-18 --out out
      - run: python tools/particles.py dna out/layer-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: layer-msi
          path: out

  generate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: T2 exactness of the angle law
        run: python tools/particles.py exactness
      - name: generate layer 1 (nothing stored but the manifest)
        run: python tools/particles.py layer --layer 1 --recipe grid-feeder --seed 2026-09-18 --out out
      - name: DNA test on the same machine
        run: python tools/particles.py dna out/layer-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: layer-${{ matrix.os }}
          path: out

  dna-across-machines:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: got
      - name: T4 reconciliation - every machine that generated the layer must hold the same hash
        run: python tools/particles.py compare got/layer-*/layer-1.json
